<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>테슬라 투자 플랜</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1218;--card:#171d2a;--card2:#11161f;--line:#263044;--text:#e9edf3;--sub:#9aa5b5;--mute:#6b7688;
--A:#4fe08f;--Ab:#0f2a1e;--B:#8fb0ff;--Bb:#1a2236;--C:#ffc34d;--Cb:#2c2410;--D:#ff7d88;--Db:#2e1519}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 44px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-size:20px;font-weight:900;letter-spacing:-.4px}
.sub{color:var(--sub);font-size:12.5px}
.price{text-align:right}.price b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.price div{font-size:12.5px;font-weight:700}.up{color:var(--A)}.dn{color:var(--D)}
section{margin-top:26px}
h2{font-size:13px;font-weight:700;color:var(--sub);margin:0 2px 10px}
.card{background:var(--card);border-radius:18px;padding:16px 18px}
.now{border:2px solid;border-radius:20px;padding:18px;margin-top:16px}
.now .top{display:flex;gap:14px;align-items:center}
.now .L{font-size:52px;font-weight:900;line-height:1}
.now .n{font-size:21px;font-weight:900}.now .d{font-size:14px;opacity:.9}
.gauge{position:relative;height:84px;margin-top:16px}
.bar{position:absolute;top:40px;left:0;right:0;height:12px;border-radius:6px;display:flex;overflow:hidden}
.bar div{height:100%;opacity:.8}
.zl{position:absolute;top:0;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap}
.tk{position:absolute;top:34px;width:2px;height:24px;background:#fff;opacity:.45}
.tl{position:absolute;top:58px;transform:translateX(-50%);font-size:11px;color:var(--sub);white-space:nowrap;text-align:center;line-height:1.3}
.mk{position:absolute;top:36px;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #fff;transition:left .6s}
.ml{position:absolute;top:16px;transform:translateX(-50%);font-size:11.5px;font-weight:900;background:#fff;color:#0b0d12;border-radius:6px;padding:0 6px;white-space:nowrap;transition:left .6s}
.pv{font-size:13px;color:var(--sub);margin-top:4px}.pv b{color:var(--text)}
.cases{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.case{border-radius:14px;padding:12px 14px;border:1.5px solid var(--line);background:var(--card2);opacity:.5}
.case.on{opacity:1;border-width:2px}
.case b{font-size:15px}.case .if{font-size:12px;color:var(--sub);margin-top:2px}.case .do{font-size:13.5px;margin-top:6px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.step{background:var(--card2);border-radius:12px;padding:9px 10px;border:1.5px solid transparent;position:relative}
.step b{display:block;font-size:13px}.step span{display:block;font-size:11.5px;color:var(--sub);line-height:1.4;margin-top:2px}
.step.done{opacity:.55}.step.done b:after{content:" ✓";color:var(--A)}
.step.cur{border-color:var(--acc);background:var(--Bb)}
.step.cur:before{content:"지금";position:absolute;top:-9px;left:8px;font-size:10.5px;font-weight:900;background:var(--acc);color:#0b0d12;border-radius:6px;padding:0 6px}
@media(max-width:520px){.steps{grid-template-columns:1fr 1fr}}
.rules dd small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.rules{display:grid;grid-template-columns:72px 1fr;gap:12px;font-size:14.5px}
.rules dt{font-weight:900;color:var(--acc)}
.stance{display:inline-block;font-size:12px;font-weight:900;padding:2px 10px;border-radius:99px;background:var(--acc);color:#0b0d12}
.note p{margin-top:8px}
.note ul{margin:6px 0 0 18px;font-size:14px;color:var(--sub)}
details{margin-top:12px}summary{cursor:pointer;color:var(--sub);font-size:13px}
.views div{margin-top:10px;font-size:14px}.views b{display:block;font-size:12px;color:var(--sub)}
.ev div{display:flex;gap:14px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.ev div:first-child{border:0;padding-top:0}
.ev time{flex:none;width:44px;color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums}
footer{margin-top:28px;color:var(--mute);font-size:12px;text-align:center;line-height:1.7}
.err{background:var(--Db);color:var(--D);padding:12px;border-radius:12px;margin-top:14px;display:none}
</style>
</head>
<body>
<div class="wrap" id="app" style="--acc:var(--B)">
 <header>
  <div><h1>테슬라 투자 플랜</h1><div class="sub" id="upd">불러오는 중…</div></div>
  <div class="price"><div class="sub">TSLA 실시간</div><b id="px">—</b><div id="chg"></div></div>
 </header>
 <div class="err" id="err"></div>

 <div class="now" id="now">
  <div class="top"><div class="L" id="L">·</div><div><div class="n" id="nn">—</div><div class="d" id="nd"></div></div></div>
  <div class="gauge" id="gauge"></div>
  <div class="pv" id="pv"></div>
 </div>

 <section><h2>경우의 수 · 종가 기준</h2><div class="cases" id="cases"></div></section>
 <section><h2>플랜 · 진행 단계</h2><div class="card"><div class="steps" id="steps"></div><dl class="rules" id="rules"></dl></div></section>
 <section><h2 id="sh">전략 노트</h2><div class="card note" id="note"></div></section>
 <section><h2>다가오는 일정</h2><div class="card ev" id="ev"></div></section>

 <footer>테슬라봇이 장 마감마다 확인하고, 정기 점검으로 전략을 고쳐요.<br>개인 참고용 정보이며 투자 권유가 아니에요.</footer>
</div>
<script>
const NAMES={A:"강한 상승",B:"박스권",C:"하락",D:"급락"};
const MEAN={A:"상승 추세가 확인됐어요. 계획대로 사고, 원하면 레버리지를 조금씩.",B:"아직 방향이 안 정해졌어요. 계획대로 일반매수만.",C:"단기적으로 밀렸어요. 다음 회차를 당겨 사도 되는 구간.",D:"많이 빠졌어요. 팔지 말고 보유."};
let S=null,live=null;
const $=id=>document.getElementById(id);
const f2=x=>x==null?"—":Number(x).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const f0=x=>Number(x).toFixed(0);
const md=d=>d?d.slice(5).replace("-","/"):"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=x=>(x*100).toFixed(0)+"%";

function render(){
 if(!S)return;
 const st=S.state,L=S.lines,px=live??S.mark??S.close,P=S.plan,lv=S.lev;
 const aL=Math.max(L.m200,L.brk);
 $("app").style.setProperty("--acc",`var(--${st})`);
 const nw=$("now");nw.style.borderColor=`var(--${st})`;nw.style.background=`var(--${st}b)`;
 $("L").textContent=st;$("L").style.color=`var(--${st})`;
 $("nn").textContent=`지금은 ${NAMES[st]}`;$("nn").style.color=`var(--${st})`;
 $("nd").textContent=MEAN[st];
 const lo=Math.min(L.m20,px,S.close)*0.95,hi=Math.max(aL,px,S.close)*1.04,pos=v=>Math.max(2,Math.min(98,(v-lo)/(hi-lo)*100));
 $("gauge").innerHTML=`<div class="bar"><div style="width:${pos(L.m20)}%;background:var(--C)"></div><div style="width:${pos(aL)-pos(L.m20)}%;background:var(--B)"></div><div style="flex:1;background:var(--A)"></div></div>
  <div class="zl" style="left:${pos(L.m20)/2}%;color:var(--C)">C</div><div class="zl" style="left:${(pos(L.m20)+pos(aL))/2}%;color:var(--B)">B</div><div class="zl" style="left:${(pos(aL)+100)/2}%;color:var(--A)">A</div>
  <div class="tk" style="left:${pos(L.m20)}%"></div><div class="tl" style="left:${pos(L.m20)}%">20일선<br>${f0(L.m20)}</div>
  <div class="tk" style="left:${pos(aL)}%"></div><div class="tl" style="left:${pos(aL)}%">${L.m200>=L.brk?"200일선":"돌파선"}<br>${f0(aL)}</div>
  <div class="mk" style="left:${pos(px)}%"></div><div class="ml" style="left:${pos(px)}%">${f2(px)}</div>`;
 const cs=px>L.m200&&px>L.brk?"A":px<L.m20?"C":"B";
 $("pv").innerHTML=st==="D"?"":`${md(S.day)} 종가 ${f2(S.close)} 기준 · `+(cs===st?`지금 가격으로 마감해도 <b>${st} 유지</b>`:`지금 가격으로 마감하면 <b>${cs}로 전환</b>`);
 $("cases").innerHTML=[["A","강한 상승",`종가 ${f0(aL)} 위`,"계획대로 + (선택) 레버리지 1/3씩"],["B","박스권",`${f0(L.m20)} ~ ${f0(aL)}`,"계획대로 일반매수만"],
  ["C","하락",`종가 ${f0(L.m20)} 아래`,"다음 회차 당겨 사기"],["D","급락","평단 −20% 아래","손절 없이 보유"]]
  .map(([k,n,i,d])=>`<div class="case ${k===st?"on":""}" style="${k===st?`border-color:var(--${k});background:var(--${k}b)`:""}"><b style="color:var(--${k})">${k} ${n}</b><div class="if">${i}</div><div class="do">${d}</div></div>`).join("");
 const tr=P.tranches,n=tr.length,nb=tr.filter(t=>t.bought).length,closed=P.state==="closed";
 // 진행 단계: 1차 → 2차 → 보유(익절 대기) → 매도·재매수 대기
 const stp=[[`1차 매수`,`${md(tr[0]?.date)}`],[`2차 매수`,`직전가 −${pct(P.dip)} 또는 ${md(tr[1]?.date)}`],["보유","익절선 기다리기"],["매도 → 재매수","−"+pct(P.reentry_dip)+" 또는 3개월 뒤"]];
 const cur=closed?3:nb>=n?2:Math.min(nb,1);
 $("steps").innerHTML=stp.map(([t,d],i)=>`<div class="step ${i<cur?"done":i===cur?"cur":""}"><b>${"①②③④"[i]} ${t}</b><span>${d}</span></div>`).join("");
 const g=P.give_th,b=P.giveback,ex=100*(1+g+0.1),line=100+(ex-100)*(1-b);
 $("rules").innerHTML=`<dt>매수</dt><dd>2번 나눠 사요. 1차 ${md(tr[0]?.date)}, 2차는 1차 매수가에서 −${pct(P.dip)} 내려오면 바로 (안 내려오면 ${md(tr[1]?.date)})</dd>
  <dt>보유</dt><dd>손절하지 않아요<small>1배 일반매수라서 크게 빠져도 기다리는 전략이에요</small></dd>
  <dt>매도</dt><dd>날짜가 아니라 '익절선'으로 팔아요. 수익이 +${pct(g)}를 넘으면 익절선이 생기고, 주가가 오를수록 따라 올라가요. 종가가 익절선 아래로 내려오면 전부 팔아요.
   <small>익절선 = 평단 + (최고가 − 평단) × ${(1-b).toFixed(1)} · 예) 평단 100, 최고 ${ex.toFixed(0)}이면 익절선 ${line.toFixed(0)} · 손실 중엔 팔지 않아요</small></dd>
  <dt>재매수</dt><dd>판 가격보다 −${pct(P.reentry_dip)} 내려오거나 약 3개월이 지나면 다시 2번 나눠 사요</dd>
  <dt>레버리지</dt><dd>선택 사항 · A일 때만 1/3씩 ${lv.every}일 간격 · ${lv.mult}배 · −${pct(lv.stop)} 손절</dd>`;
 const N=S.strategy||{};
 if(N.version){
  $("sh").textContent=`전략 노트 · v${N.version} · ${md((N.updated||"").slice(0,10))} ${(N.updated||"").slice(11)}`;
  const V=N.views||{},VL={chart:"차트",news:"뉴스",politics:"정치·머스크",reports:"금융권 리포트",backtest:"백테스트"};
  const vs=Object.keys(VL).filter(k=>V[k]&&!/채워져요/.test(V[k]));
  $("note").innerHTML=`<span class="stance">${esc(N.stance)}</span><p>${esc(N.summary)}</p>
   ${(N.changes||[]).length?`<details><summary>최근 바뀐 점</summary><ul>${N.changes.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></details>`:""}
   ${vs.length?`<details><summary>분석 의견</summary><div class="views">${vs.map(k=>`<div><b>${VL[k]}</b>${esc(V[k])}</div>`).join("")}</div></details>`:""}
   ${(N.history||[]).length?`<details><summary>지난 기록 (${N.history.length})</summary><ul>${N.history.map(h=>`<li>v${esc(h.version)} ${esc(h.date)} — ${esc(h.summary)}</li>`).join("")}</ul></details>`:""}`;
 }else $("note").innerHTML='<span class="sub">첫 정기 점검 뒤에 채워져요.</span>';
 $("ev").innerHTML=S.events.length?S.events.slice(0,5).map(e=>`<div><time>${md(e.date)}</time><span>${esc(e.name)}</span></div>`).join(""):'<div class="sub">예정된 일정 없음</div>';
}
async function getStatus(){
 try{const r=await fetch("status.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;S=await r.json();
  S.plan.dip??=0.07;S.plan.giveback??=0.4;S.plan.give_th??=0.3;S.plan.reentry_dip??=0.1;
  $("upd").textContent=`업데이트 ${S.updated.slice(5).replace("-","/")}`;$("err").style.display="none";render();getPrice();}
 catch(e){if(!S){$("err").style.display="block";$("err").textContent="아직 데이터가 없어요. 잠시 뒤 새로고침 해주세요."}}
}
async function getPrice(){
 try{const r=await fetch("https://fapi.binance.com/fapi/v1/ticker/price?symbol=TSLAUSDT");live=Number((await r.json()).price)||null}catch(e){live=null}
 const px=live??(S&&S.mark);
 if(px&&S){$("px").textContent=f2(px);const c=(px/S.close-1)*100;$("chg").textContent=`종가 대비 ${c>=0?"+":""}${c.toFixed(2)}%`;$("chg").className=c>=0?"up":"dn"}
 render();
}
getStatus();setInterval(getPrice,15000);setInterval(getStatus,120000);
</script>
</body>
</html>
